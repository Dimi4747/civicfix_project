name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 .
      - name: Run unit tests
        run: |
          pip install pytest
          pytest

  code-quality:
    name: Code Quality (SonarQube)
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Wait for Quality Gate
        uses: SonarSource/sonarcloud-github-action@master
        
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-push-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/civicfix:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/civicfix:latest

  deploy-o2switch:
    name: Deploy to O2Switch
    runs-on: ubuntu-latest
    needs: build-push-docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.O2SWITCH_SSH_KEY }}
      - name: Deploy via SSH
        env:
          O2SWITCH_USER: ${{ secrets.O2SWITCH_USER }}
          O2SWITCH_HOST: ${{ secrets.O2SWITCH_HOST }}
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/civicfix:latest
        run: |
          ssh -o StrictHostKeyChecking=no $O2SWITCH_USER@$O2SWITCH_HOST '
            docker pull $DOCKER_IMAGE && \
            # Adapter la commande ci-dessous selon la méthode de redémarrage sur O2Switch
            docker stop civicfix || true && \
            docker rm civicfix || true && \
            docker run -d --name civicfix -p 8000:8000 $DOCKER_IMAGE
          '
